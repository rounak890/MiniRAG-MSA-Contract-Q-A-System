{% extends 'base.html' %}

{% block content %}

<div class="card">

    <div class="card-header">
        Upload MSA Contract
    </div>

    <div class="card-body">

        <form method="post"
              enctype="multipart/form-data">

            {% csrf_token %}

            {{ form.as_p }}

            <button class="btn btn-primary">
                Upload & Process
            </button>

        </form>

    </div>

</div>

{% endblock %}
