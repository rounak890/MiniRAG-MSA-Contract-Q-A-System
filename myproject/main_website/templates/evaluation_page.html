{% extends 'base.html' %}

{% block content %}

<div class="card">

    <div class="card-header">
        Ground Truth Evaluation
    </div>

    <div class="card-body">

        <button
            id="evaluateBtn"
            class="btn btn-primary">

            Run Evaluation

        </button>

    </div>

</div>

<hr>

<div class="card">

    <div class="card-header">
        Evaluation Summary
    </div>

    <div class="card-body">

        <table class="table">

            <thead>
                <tr>
                    <th>Category</th>
                    <th>Judgement</th>
                    <th>Reason</th>
                </tr>
            </thead>

            <tbody id="evaluationTable">

            </tbody>

        </table>

        <h4 id="accuracy"></h4>

    </div>

</div>

{% endblock %}
